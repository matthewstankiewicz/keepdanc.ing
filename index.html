<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centered Image</title>
  <style>
    /* Make the whole page black and use flexbox to center content */
    body {
      margin: 0;
      height: 100vh;           /* full viewport height */
      display: flex;           /* enable flexbox */
      justify-content: center; /* horizontal center */
      align-items: center;     /* vertical center */
      background-color: black; /* black background */
    }

    /* Optional: scale image to fit nicely */
    img {
      max-width: 90%;          /* don't exceed 90% of viewport width */
      max-height: 90%;         /* don't exceed 90% of viewport height */
      object-fit: contain;     /* maintain aspect ratio */
    }
  </style>
</head>
<body>
  <!-- Replace "your-image.jpg" with your image file -->
  <img src="keep-dancing.png" alt="Centered Image">
